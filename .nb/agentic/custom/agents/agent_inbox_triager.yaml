## 4. Agent Implementation: `agent_inbox_triager`

```yaml
# .nb/agentic/custom/agents/agent_inbox_triager.yaml

agent_id: agent_inbox_triager
agent_name: Inbox Triage Coordinator
version: 1.0.0
extension: email_triage
model_tier: tier_a
description: Intelligent email classification into smart inbox categories

capabilities:
  - email_classification
  - priority_scoring
  - sender_reputation
  - category_routing

tools:
  - classify_email
  - batch_classify_emails
  - update_classification

model_configuration:
  primary_model: claude-3-7-sonnet
  fallback_model: claude-3-5-haiku
  temperature: 0.1
  max_tokens: 1024

system_prompt: |
  You are the Inbox Triager for Personal OS Email Extension. Your role is to:

  1. Classify emails into 5 categories:
     - **action_required**: Emails needing a response or action from the user
     - **fyi**: Informational emails (no action needed)
     - **newsletter**: Marketing, promotions, bulk emails
     - **receipt**: Purchase confirmations, invoices, receipts
     - **spam**: Unwanted or suspicious emails

  2. Provide confidence scores (0.0-1.0) for classifications

  3. Explain reasoning in 1-2 sentences

  CLASSIFICATION GUIDELINES:

  **Action Required**:
  - Direct questions to the user
  - Meeting requests without calendar invite
  - Code review requests
  - Deadline-driven requests
  - From known contacts asking for something

  **FYI**:
  - Status updates, deployment notifications
  - CC'd on threads where user is not primary recipient
  - Team announcements
  - Automated system notifications

  **Newsletter**:
  - Contains unsubscribe link
  - From mailing list or marketing platform
  - HTML-heavy promotional content
  - Regular digest emails

  **Receipt**:
  - Contains price/amount
  - From known merchants (Stripe, PayPal, Amazon, etc.)
  - Subject contains: receipt, invoice, order, payment
  - Has attachment: .pdf invoice

  **Spam**:
  - Suspicious links or attachments
  - Excessive capitalization or urgency
  - From unknown sender with generic greeting
  - Phishing indicators

tool_schemas:
  classify_email:
    input:
      message_id: string
      subject: string
      from_email: string
      from_name: string
      body_snippet: string
      features:
        type: object
        properties:
          has_question_mark: boolean
          has_deadline_words: boolean
          has_unsubscribe_link: boolean
          has_price_pattern: boolean
          sender_in_contacts: boolean
          is_cc_recipient: boolean
    output:
      category: string
      confidence: float
      reasoning: string

capability_token:
  permissions:
    - emails:read
    - emails:classify
    - contacts:read
  restrictions:
    max_batch_size: 100

metrics:
  success_criteria:
    - classification_accuracy > 0.90
    - avg_confidence > 0.75
  performance_targets:
    classification_time_ms: 200
    batch_throughput_per_second: 50

error_handling:
  retry_policy:
    max_attempts: 2
    backoff_strategy: none
  fallback_behavior:
    on_llm_failure: use_rule_based_classifier

logging:
  log_level: info
  audit_trail: true
