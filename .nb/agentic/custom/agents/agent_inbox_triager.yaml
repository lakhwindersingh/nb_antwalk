## 3. SQLite Schema

```sql
-- Email accounts
CREATE TABLE IF NOT EXISTS email_accounts (
    id TEXT PRIMARY KEY,
    email TEXT UNIQUE NOT NULL,
    provider TEXT NOT NULL CHECK (provider IN ('gmail', 'imap', 'exchange')),
    provider_config JSON NOT NULL,
    vault_credential_id TEXT NOT NULL,
    last_sync DATETIME,
    last_message_id TEXT,
    sync_token TEXT,
    is_active BOOLEAN NOT NULL DEFAULT 1,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
);

-- Email metadata (bodies not stored)
CREATE TABLE IF NOT EXISTS emails (
    id TEXT PRIMARY KEY,
    message_id TEXT UNIQUE NOT NULL,
    account_id TEXT NOT NULL REFERENCES email_accounts(id) ON DELETE CASCADE,
    thread_id TEXT,
    in_reply_to TEXT,
    from_name TEXT NOT NULL,
    from_email TEXT NOT NULL,
    to_emails JSON NOT NULL,
    cc_emails JSON,
    subject TEXT NOT NULL,
    date DATETIME NOT NULL,
    body_snippet TEXT NOT NULL, -- First 500 chars
    has_attachments BOOLEAN NOT NULL DEFAULT 0,
    category TEXT CHECK (category IN ('action_required', 'fyi', 'newsletter', 'receipt', 'spam')),
    classification_confidence REAL,
    classification_reasoning TEXT,
    is_read BOOLEAN NOT NULL DEFAULT 0,
    is_archived BOOLEAN NOT NULL DEFAULT 0,
    fetched_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    INDEX idx_emails_account_date (account_id, date DESC),
    INDEX idx_emails_category (category, date DESC),
    INDEX idx_emails_thread (thread_id)
);

-- Email summaries
CREATE TABLE IF NOT EXISTS email_summaries (
    id TEXT PRIMARY KEY,
    email_id TEXT UNIQUE NOT NULL REFERENCES emails(id) ON DELETE CASCADE,
    summary TEXT NOT NULL,
    key_points JSON NOT NULL,
    generated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
);

-- Extracted entities (linkage to Personal OS pillars)
CREATE TABLE IF NOT EXISTS email_extracted_entities (
    id TEXT PRIMARY KEY,
    email_id TEXT NOT NULL REFERENCES emails(id) ON DELETE CASCADE,
    entity_type TEXT NOT NULL CHECK (entity_type IN ('task', 'event', 'contact', 'receipt')),
    entity_id TEXT NOT NULL, -- ID in target pillar (e.g., project_task_id)
    pillar TEXT NOT NULL CHECK (pillar IN ('projects', 'activities', 'interactions', 'purchases')),
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    INDEX idx_entities_email (email_id),
    INDEX idx_entities_target (pillar, entity_id)
);

-- Reply drafts
CREATE TABLE IF NOT EXISTS email_reply_drafts (
    id TEXT PRIMARY KEY,
    email_id TEXT NOT NULL REFERENCES emails(id) ON DELETE CASCADE,
    draft_body TEXT NOT NULL,
    tone TEXT NOT NULL,
    confidence REAL NOT NULL,
    generated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    sent BOOLEAN NOT NULL DEFAULT 0,
    sent_at DATETIME
);
```

