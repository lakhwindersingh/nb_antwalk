```rust
// workplace/modules/pos_email/src/lib.rs

pub struct EmailAccount {
    pub id: Uuid,
    pub email: String,
    pub provider: EmailProvider,
    pub credentials: CredentialRef, // Reference to vault item
    pub sync_state: SyncState,
}

pub enum EmailProvider {
    Gmail { project_id: String, client_id: String },
    IMAP { host: String, port: u16, tls: bool },
    Exchange { server_url: String },
}

pub struct SyncState {
    pub last_sync: DateTime<Utc>,
    pub last_message_id: Option<String>,
    pub sync_token: Option<String>, // For Gmail API
}

pub struct Email {
    pub id: Uuid,
    pub message_id: String,
    pub account_id: Uuid,
    pub from: EmailAddress,
    pub to: Vec<EmailAddress>,
    pub cc: Vec<EmailAddress>,
    pub subject: String,
    pub date: DateTime<Utc>,
    pub body_snippet: String, // First 500 chars
    pub has_attachments: bool,
    pub thread_id: Option<String>,
    pub in_reply_to: Option<String>,
    pub category: Option<EmailCategory>,
    pub classification_confidence: Option<f32>,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub enum EmailCategory {
    ActionRequired,
    FYI,
    Newsletter,
    Receipt,
    Spam,
}

pub trait EmailClient: Send + Sync {
    async fn authenticate(&mut self, credentials: &SecretBuffer) -> Result<()>;
    async fn fetch_messages(&self, since: DateTime<Utc>) -> Result<Vec<RawMessage>>;
    async fn mark_read(&self, message_id: &str) -> Result<()>;
    async fn archive(&self, message_id: &str) -> Result<()>;
    async fn send(&self, message: &OutgoingMessage) -> Result<()>;
}
```

### 2.2. `pos_triage` - Classification & Extraction

```rust
// workplace/modules/pos_triage/src/lib.rs

pub struct EmailClassifier {
    llm_client: LlmClient,
    feature_extractor: FeatureExtractor,
}

impl EmailClassifier {
    pub async fn classify(&self, email: &Email) -> Result<Classification> {
        // Extract features for classification
        let features = self.feature_extractor.extract(email);

        // Use LLM for classification (or local model as fallback)
        let prompt = format!(
            "Classify this email into one of: action_required, fyi, newsletter, receipt, spam\n\
             Subject: {}\n\
             From: {}\n\
             Snippet: {}\n\
             Features: {:#?}\n\n\
             Return JSON: {{\"category\": \"...\", \"confidence\": 0.0-1.0, \"reasoning\": \"...\"}}",
            email.subject, email.from, email.body_snippet, features
        );

        let response = self.llm_client.complete(&prompt).await?;
        let classification: Classification = serde_json::from_str(&response)?;

        Ok(classification)
    }
}

pub struct FeatureExtractor;

impl FeatureExtractor {
    pub fn extract(&self, email: &Email) -> EmailFeatures {
        EmailFeatures {
            has_question_mark: email.subject.contains('?') || email.body_snippet.contains('?'),
            has_deadline_words: self.contains_deadline_words(&email.body_snippet),
            has_unsubscribe_link: email.body_snippet.contains("unsubscribe"),
            has_price_pattern: self.extract_price(&email.body_snippet).is_some(),
            sender_in_contacts: false, // TODO: check against CRM
            is_cc_recipient: email.cc.iter().any(|addr| addr.email == "user@example.com"),
            word_count: email.body_snippet.split_whitespace().count(),
        }
    }

    fn contains_deadline_words(&self, text: &str) -> bool {
        let deadline_keywords = ["deadline", "due", "by tomorrow", "asap", "urgent"];
        deadline_keywords.iter().any(|kw| text.to_lowercase().contains(kw))
    }

    fn extract_price(&self, text: &str) -> Option<f64> {
        // Regex: $XX.XX or XX.XX USD
        let re = regex::Regex::new(r"\$(\d+(?:\.\d{2})?)").unwrap();
        re.captures(text)
            .and_then(|cap| cap.get(1))
            .and_then(|m| m.as_str().parse::<f64>().ok())
    }
}

pub struct EntityExtractor {
    llm_client: LlmClient,
}

impl EntityExtractor {
    pub async fn extract_tasks(&self, email: &Email) -> Result<Vec<ExtractedTask>> {
        let prompt = format!(
            "Extract action items from this email. Return JSON array.\n\n\
             Subject: {}\n\
             Body: {}\n\n\
             Format: [{{\"title\": \"...\", \"description\": \"...\", \"due_date\": \"YYYY-MM-DD or null\", \"priority\": 1-4}}]",
            email.subject, email.body_snippet
        );

        let response = self.llm_client.complete_structured(&prompt).await?;
        let tasks: Vec<ExtractedTask> = serde_json::from_str(&response)?;

        Ok(tasks)
    }

    pub async fn extract_events(&self, email: &Email) -> Result<Vec<ExtractedEvent>> {
        // Parse .ics attachments if present
        if email.has_attachments {
            // TODO: Fetch and parse .ics file
        }

        // Otherwise, use LLM to extract meeting details from text
        let prompt = format!(
            "Extract meeting/event details from this email. Return JSON array.\n\n\
             Subject: {}\n\
             Body: {}\n\n\
             Format: [{{\"title\": \"...\", \"start\": \"ISO8601\", \"end\": \"ISO8601\", \"location\": \"...\", \"attendees\": [...]}}]",
            email.subject, email.body_snippet
        );

        let response = self.llm_client.complete_structured(&prompt).await?;
        let events: Vec<ExtractedEvent> = serde_json::from_str(&response)?;

        Ok(events)
    }

    pub async fn extract_contacts(&self, email: &Email) -> Result<Vec<ExtractedContact>> {
        // Extract from email signature
        let signature = self.extract_signature(&email.body_snippet);

        // Parse name, title, company, phone
        let contact = self.parse_signature(&signature)?;

        Ok(vec![contact])
    }

    pub async fn extract_receipt(&self, email: &Email) -> Result<ExtractedReceipt> {
        let prompt = format!(
            "Extract receipt details from this email. Return JSON.\n\n\
             Subject: {}\n\
             Body: {}\n\n\
             Format: {{\"vendor\": \"...\", \"amount_cents\": 0, \"currency\": \"USD\", \"date\": \"YYYY-MM-DD\", \"items\": [...]}}",
            email.subject, email.body_snippet
        );

        let response = self.llm_client.complete_structured(&prompt).await?;
        let receipt: ExtractedReceipt = serde_json::from_str(&response)?;

        Ok(receipt)
    }
}
