workflow_id: wf_vault_credential_lease
workflow_name: Vault Credential Lease Workflow
version: 1.0.0
description: Scoped ephemeral credential leasing with HITL approval and memory scrubbing

trigger_conditions:
  - type: agent_request
  - type: manual_invoke

input_parameters:
  secret_name:
    type: string
    required: true
    description: Name of the vault item to lease
  requesting_agent_id:
    type: string
    required: true
    description: ID of the agent requesting access
  purpose:
    type: string
    required: true
    description: Justification for access
  duration_seconds:
    type: integer
    default: 300
    min: 60
    max: 3600
    description: Requested lease duration in seconds
  scope:
    type: string
    default: read_only
    description: Scope of access (e.g., read_only, api_call:github)

steps:
  - step_id: validate_agent
    name: Validate Requesting Agent
    agent: agent_vault_guardian
    action: validate_agent_identity
    input:
      agent_id: "{{ input.requesting_agent_id }}"
    output_variable: agent_validation
    timeout_seconds: 5

  - step_id: check_secret_exists
    name: Check Vault Item Exists
    agent: agent_vault_guardian
    action: check_secret
    input:
      secret_name: "{{ input.secret_name }}"
    output_variable: secret_metadata
    timeout_seconds: 5
    depends_on:
      - validate_agent

  - step_id: check_hitl_required
    name: Determine if HITL Approval Required
    action: evaluate_policy
    input:
      rules:
        - first_time_agent_access
        - permanent_credential_types
        - non_business_hours
      context:
        agent_id: "{{ input.requesting_agent_id }}"
        secret_name: "{{ input.secret_name }}"
        item_type: "{{ secret_metadata.item_type }}"
        timestamp: now
    output_variable: hitl_required
    timeout_seconds: 2
    depends_on:
      - check_secret_exists

  - step_id: request_hitl_approval
    name: Request Human Approval
    action: hitl_queue
    input:
      queue_file: user/hitl/vault_approval_queue.md
      request_id: "vault_{{ workflow_run_id }}"
      template: |
        ## Vault Credential Lease Request

        **Request ID**: {{ workflow_run_id }}
        **Timestamp**: {{ now }}
        **Requesting Agent**: {{ input.requesting_agent_id }}
        **Secret**: {{ input.secret_name }}
        **Item Type**: {{ secret_metadata.item_type }}
        **Purpose**: {{ input.purpose }}
        **Scope**: {{ input.scope }}
        **Duration**: {{ input.duration_seconds }}s ({{ input.duration_seconds / 60 }} minutes)

        **Actions**:
        - [ ] APPROVE
        - [ ] DENY

        **Timeout**: 5 minutes
    output_variable: hitl_decision
    timeout_seconds: 300  # 5 minutes
    depends_on:
      - check_hitl_required
    skip_if: "{{ !hitl_required.required }}"

  - step_id: grant_lease
    name: Grant Ephemeral Lease
    agent: agent_vault_guardian
    tool: acquire_lease
    input:
      secret_name: "{{ input.secret_name }}"
      agent_id: "{{ input.requesting_agent_id }}"
      duration_seconds: "{{ input.duration_seconds }}"
      scope: "{{ input.scope }}"
    output_variable: lease
    timeout_seconds: 10
    depends_on:
      - check_secret_exists
      - request_hitl_approval
    skip_if: "{{ hitl_required.required && hitl_decision.action != 'APPROVE' }}"

  - step_id: log_to_audit_trail
    name: Append Audit Trail Entry
    agent: agent_vault_guardian
    action: append_ledger
    input:
      operation: vault_lease_granted
      agent_id: "{{ input.requesting_agent_id }}"
      resource: "vault_item:{{ input.secret_name }}"
      lease_id: "{{ lease.lease_id }}"
      expires_at: "{{ lease.expires_at }}"
      hitl_approved: "{{ hitl_decision.action == 'APPROVE' || false }}"
    output_variable: ledger_entry
    timeout_seconds: 5
    depends_on:
      - grant_lease

  - step_id: return_lease
    name: Return Lease to Requesting Agent
    action: respond
    input:
      lease_id: "{{ lease.lease_id }}"
      secret_value: "{{ lease.secret_value }}"
      expires_at: "{{ lease.expires_at }}"
      warning: "This secret is memory-scrubbed on drop. Do not log or persist."
    depends_on:
      - log_to_audit_trail

output:
  lease_id: "{{ lease.lease_id }}"
  granted: "{{ lease != null }}"
  expires_at: "{{ lease.expires_at }}"
  hitl_approved: "{{ hitl_decision.action == 'APPROVE' || false }}"

error_handling:
  on_step_failure: fail_and_deny
  on_timeout: deny_and_alert
  on_hitl_deny: log_and_return_error
  final_notification: always

notifications:
  on_success:
    - channel: log
      template: "✅ Vault lease granted: {{ input.secret_name }} to {{ input.requesting_agent_id }}"
  on_failure:
    - channel: log
      template: "❌ Vault lease denied: {{ input.secret_name }} - {{ error.message }}"
  on_hitl_deny:
    - channel: cli
      template: "🚫 Vault access denied by user: {{ input.secret_name }}"

security:
  memory_scrubbing: required
  secret_redaction: all_outputs
  audit_trail: mandatory

metrics:
  track_execution_time: true
  track_approval_rate: true
  track_denial_reasons: true
  alert_on_repeated_denials: 3
