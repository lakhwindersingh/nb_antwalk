schema_version: "1.0.0"
domain: "personal_os"
service_endpoint: "/api/v1/personal_os"
description: "Core IPC/REST/MCP wire contracts for Personal OS 8-pillar architecture"

pillars:
  - id: "projects"
    description: "Workspace, repository, and task management subsystem"
    methods:
      - name: "list_workspaces"
        description: "List all tracked project workspaces"
        input_schema:
          type: "object"
          properties:
            status_filter:
              type: "string"
              enum: ["active", "paused", "completed", "archived", "all"]
              default: "active"
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              id: { type: "string" }
              name: { type: "string" }
              root_path: { type: "string" }
              status: { type: "string" }
              task_count: { type: "integer" }

      - name: "sync_repo"
        description: "Synchronize local git repository with remote"
        input_schema:
          type: "object"
          required: ["project_id"]
          properties:
            project_id: { type: "string" }
            fetch_only: { type: "boolean", default: false }
        output_schema:
          type: "object"
          properties:
            success: { type: "boolean" }
            commits_fetched: { type: "integer" }
            current_branch: { type: "string" }

      - name: "create_worktree"
        description: "Create ephemeral git worktree for isolated agent work"
        input_schema:
          type: "object"
          required: ["project_id", "branch_name"]
          properties:
            project_id: { type: "string" }
            branch_name: { type: "string" }
            base_ref: { type: "string", default: "HEAD" }
        output_schema:
          type: "object"
          properties:
            worktree_path: { type: "string" }
            branch: { type: "string" }
            expires_at: { type: "string", format: "date-time" }

      - name: "track_task"
        description: "Create or update project task"
        input_schema:
          type: "object"
          required: ["project_id", "title"]
          properties:
            project_id: { type: "string" }
            title: { type: "string" }
            description: { type: "string" }
            priority: { type: "integer", minimum: 1, maximum: 4 }
            status: { type: "string", enum: ["todo", "in_progress", "review", "done", "canceled"] }
            due_date: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            task_id: { type: "string" }
            created: { type: "boolean" }

  - id: "files"
    description: "Content-addressable file storage and hybrid search subsystem"
    methods:
      - name: "ingest_file"
        description: "Process and index a file into CAS storage"
        input_schema:
          type: "object"
          required: ["file_path"]
          properties:
            file_path: { type: "string" }
            extract_text: { type: "boolean", default: true }
            generate_embedding: { type: "boolean", default: true }
        output_schema:
          type: "object"
          properties:
            file_id: { type: "string" }
            blake3_hash: { type: "string" }
            mime_type: { type: "string" }
            size_bytes: { type: "integer" }

      - name: "search_hybrid"
        description: "Perform hybrid BM25 + vector search across indexed files"
        input_schema:
          type: "object"
          required: ["query"]
          properties:
            query: { type: "string" }
            limit: { type: "integer", default: 10, maximum: 100 }
            mime_type_filter: { type: "array", items: { type: "string" } }
            semantic_weight: { type: "number", minimum: 0.0, maximum: 1.0, default: 0.5 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              file_id: { type: "string" }
              file_path: { type: "string" }
              score: { type: "number" }
              snippet: { type: "string" }

      - name: "deduplicate"
        description: "Find duplicate files by content hash"
        input_schema:
          type: "object"
          properties:
            directory: { type: "string" }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              blake3_hash: { type: "string" }
              file_paths: { type: "array", items: { type: "string" } }
              size_bytes: { type: "integer" }

      - name: "get_blob"
        description: "Retrieve file content by hash or ID"
        input_schema:
          type: "object"
          properties:
            file_id: { type: "string" }
            blake3_hash: { type: "string" }
        output_schema:
          type: "object"
          properties:
            content: { type: "string" }
            mime_type: { type: "string" }

  - id: "thoughts"
    description: "Zettelkasten knowledge graph and thought capture subsystem"
    methods:
      - name: "capture_note"
        description: "Quick capture a thought or note"
        input_schema:
          type: "object"
          required: ["content"]
          properties:
            title: { type: "string" }
            content: { type: "string" }
            thought_type: { type: "string", enum: ["fleeting", "journal", "atomic", "concept"], default: "fleeting" }
            tags: { type: "array", items: { type: "string" } }
        output_schema:
          type: "object"
          properties:
            thought_id: { type: "string" }
            wikilinks_extracted: { type: "array", items: { type: "string" } }

      - name: "query_graph"
        description: "Query the knowledge graph structure"
        input_schema:
          type: "object"
          required: ["thought_id"]
          properties:
            thought_id: { type: "string" }
            depth: { type: "integer", default: 2, maximum: 5 }
            direction: { type: "string", enum: ["outbound", "inbound", "both"], default: "both" }
        output_schema:
          type: "object"
          properties:
            nodes: { type: "array", items: { type: "object" } }
            edges: { type: "array", items: { type: "object" } }

      - name: "find_associative"
        description: "Find semantically related thoughts via vector similarity"
        input_schema:
          type: "object"
          required: ["query"]
          properties:
            query: { type: "string" }
            limit: { type: "integer", default: 5, maximum: 20 }
            min_similarity: { type: "number", default: 0.7, minimum: 0.0, maximum: 1.0 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              thought_id: { type: "string" }
              title: { type: "string" }
              similarity: { type: "number" }
              snippet: { type: "string" }

      - name: "daily_journal"
        description: "Create or retrieve today's daily journal entry"
        input_schema:
          type: "object"
          properties:
            date: { type: "string", format: "date" }
        output_schema:
          type: "object"
          properties:
            thought_id: { type: "string" }
            date: { type: "string" }
            content: { type: "string" }

  - id: "activities"
    description: "Calendar, habit tracking, and life telemetry subsystem"
    methods:
      - name: "sync_calendar"
        description: "Synchronize with external calendar sources (iCal/CalDAV)"
        input_schema:
          type: "object"
          properties:
            source_url: { type: "string" }
            date_range_start: { type: "string", format: "date" }
            date_range_end: { type: "string", format: "date" }
        output_schema:
          type: "object"
          properties:
            events_imported: { type: "integer" }
            last_sync: { type: "string", format: "date-time" }

      - name: "log_habit"
        description: "Record a habit completion"
        input_schema:
          type: "object"
          required: ["habit_id"]
          properties:
            habit_id: { type: "string" }
            value: { type: "integer", default: 1 }
            timestamp: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            log_id: { type: "string" }
            current_streak: { type: "integer" }
            longest_streak: { type: "integer" }

      - name: "record_telemetry"
        description: "Log activity telemetry (focus sessions, app usage)"
        input_schema:
          type: "object"
          required: ["category", "start_time"]
          properties:
            category: { type: "string", enum: ["meeting", "focus_work", "exercise", "personal", "rest"] }
            title: { type: "string" }
            start_time: { type: "string", format: "date-time" }
            end_time: { type: "string", format: "date-time" }
            notes: { type: "string" }
        output_schema:
          type: "object"
          properties:
            activity_id: { type: "string" }
            duration_minutes: { type: "integer" }

      - name: "get_daily_agenda"
        description: "Retrieve daily schedule and priorities"
        input_schema:
          type: "object"
          properties:
            date: { type: "string", format: "date" }
        output_schema:
          type: "object"
          properties:
            date: { type: "string" }
            activities: { type: "array", items: { type: "object" } }
            top_tasks: { type: "array", items: { type: "object" } }
            habit_reminders: { type: "array", items: { type: "object" } }

  - id: "workflows"
    description: "Declarative async workflow and routine execution subsystem"
    methods:
      - name: "dispatch_dag"
        description: "Execute a workflow DAG"
        input_schema:
          type: "object"
          required: ["workflow_id"]
          properties:
            workflow_id: { type: "string" }
            input_params: { type: "object" }
        output_schema:
          type: "object"
          properties:
            run_id: { type: "string" }
            status: { type: "string", enum: ["queued", "running", "success", "failed"] }

      - name: "schedule_cron"
        description: "Schedule a recurring workflow"
        input_schema:
          type: "object"
          required: ["workflow_id", "cron_expression"]
          properties:
            workflow_id: { type: "string" }
            cron_expression: { type: "string" }
            is_active: { type: "boolean", default: true }
        output_schema:
          type: "object"
          properties:
            schedule_id: { type: "string" }
            next_run_at: { type: "string", format: "date-time" }

      - name: "poll_routine"
        description: "Check status of a workflow execution"
        input_schema:
          type: "object"
          required: ["run_id"]
          properties:
            run_id: { type: "string" }
        output_schema:
          type: "object"
          properties:
            run_id: { type: "string" }
            status: { type: "string" }
            progress: { type: "number", minimum: 0.0, maximum: 1.0 }
            error: { type: "string" }

      - name: "list_runs"
        description: "List workflow execution history"
        input_schema:
          type: "object"
          properties:
            workflow_id: { type: "string" }
            limit: { type: "integer", default: 20, maximum: 100 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              run_id: { type: "string" }
              workflow_id: { type: "string" }
              status: { type: "string" }
              started_at: { type: "string", format: "date-time" }

  - id: "credentials"
    description: "Zero-knowledge encrypted vault and secret leasing subsystem"
    methods:
      - name: "acquire_lease"
        description: "Request ephemeral scoped access to a credential"
        input_schema:
          type: "object"
          required: ["secret_name", "agent_id"]
          properties:
            secret_name: { type: "string" }
            agent_id: { type: "string" }
            duration_seconds: { type: "integer", default: 300, maximum: 3600 }
            scope: { type: "string" }
        output_schema:
          type: "object"
          properties:
            lease_id: { type: "string" }
            expires_at: { type: "string", format: "date-time" }
            secret_value: { type: "string", description: "Memory-scrubbed on drop" }

      - name: "revoke_lease"
        description: "Revoke an active credential lease"
        input_schema:
          type: "object"
          required: ["lease_id"]
          properties:
            lease_id: { type: "string" }
        output_schema:
          type: "object"
          properties:
            revoked: { type: "boolean" }

      - name: "store_secret"
        description: "Store a new encrypted secret in the vault"
        input_schema:
          type: "object"
          required: ["name", "secret_value", "item_type"]
          properties:
            name: { type: "string" }
            secret_value: { type: "string" }
            item_type: { type: "string", enum: ["api_key", "password", "token", "certificate"] }
        output_schema:
          type: "object"
          properties:
            vault_item_id: { type: "string" }
            created: { type: "boolean" }

      - name: "audit_access"
        description: "Retrieve vault access audit log"
        input_schema:
          type: "object"
          properties:
            secret_name: { type: "string" }
            since: { type: "string", format: "date-time" }
            limit: { type: "integer", default: 50, maximum: 200 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              lease_id: { type: "string" }
              agent_id: { type: "string" }
              acquired_at: { type: "string", format: "date-time" }
              revoked_at: { type: "string", format: "date-time" }

  - id: "interactions"
    description: "Personal CRM and communication tracking subsystem"
    methods:
      - name: "log_interaction"
        description: "Record a communication or meeting"
        input_schema:
          type: "object"
          required: ["interaction_type", "summary"]
          properties:
            contact_id: { type: "string" }
            interaction_type: { type: "string", enum: ["email", "call", "meeting", "message"] }
            summary: { type: "string" }
            key_decisions: { type: "array", items: { type: "string" } }
            action_items: { type: "array", items: { type: "string" } }
            occurred_at: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            interaction_id: { type: "string" }

      - name: "search_contacts"
        description: "Search contact database"
        input_schema:
          type: "object"
          required: ["query"]
          properties:
            query: { type: "string" }
            limit: { type: "integer", default: 10, maximum: 50 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              contact_id: { type: "string" }
              name: { type: "string" }
              email: { type: "string" }
              organization: { type: "string" }
              last_contacted_at: { type: "string", format: "date-time" }

      - name: "record_meeting_debrief"
        description: "Process meeting notes and extract structured data"
        input_schema:
          type: "object"
          required: ["meeting_notes"]
          properties:
            meeting_notes: { type: "string" }
            attendees: { type: "array", items: { type: "string" } }
            meeting_date: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            interaction_id: { type: "string" }
            extracted_action_items: { type: "array", items: { type: "object" } }
            key_decisions: { type: "array", items: { type: "string" } }

  - id: "purchases"
    description: "Financial ledger and subscription tracking subsystem"
    methods:
      - name: "ingest_receipt"
        description: "Process receipt image via OCR and extract transaction data"
        input_schema:
          type: "object"
          required: ["image_path"]
          properties:
            image_path: { type: "string" }
            category: { type: "string" }
        output_schema:
          type: "object"
          properties:
            purchase_id: { type: "string" }
            vendor: { type: "string" }
            amount_cents: { type: "integer" }
            currency: { type: "string" }
            purchased_at: { type: "string", format: "date-time" }

      - name: "audit_subscriptions"
        description: "List active subscriptions and renewal dates"
        input_schema:
          type: "object"
          properties:
            upcoming_days: { type: "integer", default: 30 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              subscription_id: { type: "string" }
              vendor: { type: "string" }
              amount_cents: { type: "integer" }
              billing_period: { type: "string" }
              next_renewal_date: { type: "string", format: "date" }
              days_until_renewal: { type: "integer" }

      - name: "log_expense"
        description: "Manually log an expense"
        input_schema:
          type: "object"
          required: ["vendor", "amount_cents", "category"]
          properties:
            vendor: { type: "string" }
            amount_cents: { type: "integer" }
            currency: { type: "string", default: "USD" }
            category: { type: "string" }
            notes: { type: "string" }
            purchased_at: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            purchase_id: { type: "string" }

      - name: "budget_status"
        description: "Get current budget status across categories"
        input_schema:
          type: "object"
          properties:
            period: { type: "string", enum: ["weekly", "monthly", "quarterly"], default: "monthly" }
        output_schema:
          type: "object"
          properties:
            period: { type: "string" }
            categories: { type: "array", items: { type: "object" } }
            total_spent_cents: { type: "integer" }
            total_budget_cents: { type: "integer" }

security:
  authentication: "local_daemon_only"
  authorization: "capability_token_based"
  encryption: "ChaCha20-Poly1305 for vault, TLS 1.3 for external sync"
  memory_safety: "Zeroize on drop for all secret buffers"

error_codes:
  - code: "POS_ERR_001"
    message: "Invalid wire contract schema"
  - code: "POS_ERR_002"
    message: "Unauthorized vault access attempt"
  - code: "POS_ERR_003"
    message: "HITL approval required"
  - code: "POS_ERR_004"
    message: "Resource not found"
  - code: "POS_ERR_005"
    message: "Storage engine failure"
