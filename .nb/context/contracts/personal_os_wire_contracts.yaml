schema_version: "1.2.0"
domain: "personal_os"
service_endpoint: "/api/v1/personal_os"
description: "Core IPC/REST/MCP wire contracts for Personal OS 8-pillar architecture + Meta-Orchestrator"

pillars:
  - id: "orchestration"
    description: "Meta-orchestrator semantic intent classification and processor routing subsystem"
    methods:
      - name: "classify_intent"
        description: "Classify incoming user request into primary/secondary intents with confidence scoring"
        input_schema:
          type: "object"
          required: ["request_text"]
          properties:
            request_text: { type: "string" }
            context_summary: { type: "object" }
        output_schema:
          type: "object"
          properties:
            primary_intent: { type: "string" }
            secondary_intents: { type: "array", items: { type: "string" } }
            complexity: { type: "string", enum: ["simple", "moderate", "complex", "exploratory"] }
            confidence: { type: "number" }
            suggested_processors: { type: "array", items: { type: "object" } }

      - name: "route_request"
        description: "Dispatch request across registered domain processors with dependency sequencing"
        input_schema:
          type: "object"
          required: ["request_text"]
          properties:
            request_text: { type: "string" }
            options: { type: "object" }
        output_schema:
          type: "object"
          properties:
            execution_id: { type: "string" }
            status: { type: "string" }
            routed_processors: { type: "array", items: { type: "string" } }

      - name: "list_processors"
        description: "List all registered subsystem processors and execution telemetry"
        input_schema:
          type: "object"
          properties:
            filter_category: { type: "string" }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              processor_id: { type: "string" }
              capabilities: { type: "array", items: { type: "string" } }
              health_status: { type: "string" }

  - id: "projects"
    description: "Workspace, repository, and task management subsystem"
    methods:
      - name: "list_workspaces"
        description: "List all tracked project workspaces"
        input_schema:
          type: "object"
          properties:
            status_filter:
              type: "string"
              enum: ["active", "paused", "completed", "archived", "all"]
              default: "active"
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              id: { type: "string" }
              name: { type: "string" }
              root_path: { type: "string" }
              status: { type: "string" }
              task_count: { type: "integer" }

      - name: "sync_repo"
        description: "Synchronize local git repository with remote"
        input_schema:
          type: "object"
          required: ["project_id"]
          properties:
            project_id: { type: "string" }
            fetch_only: { type: "boolean", default: false }
        output_schema:
          type: "object"
          properties:
            success: { type: "boolean" }
            commits_fetched: { type: "integer" }
            current_branch: { type: "string" }

      - name: "create_worktree"
        description: "Create ephemeral git worktree for isolated agent work"
        input_schema:
          type: "object"
          required: ["project_id", "branch_name"]
          properties:
            project_id: { type: "string" }
            branch_name: { type: "string" }
            base_ref: { type: "string", default: "HEAD" }
        output_schema:
          type: "object"
          properties:
            worktree_path: { type: "string" }
            branch: { type: "string" }
            expires_at: { type: "string", format: "date-time" }

      - name: "execute_task_dag"
        description: "Execute a Petgraph task DAG with dependency constraints"
        input_schema:
          type: "object"
          required: ["project_id", "task_ids"]
          properties:
            project_id: { type: "string" }
            task_ids: { type: "array", items: { type: "string" } }
        output_schema:
          type: "object"
          properties:
            dag_execution_id: { type: "string" }
            status: { type: "string" }

      - name: "sync_external"
        description: "Bidirectional task sync with external providers (GitHub/Linear)"
        input_schema:
          type: "object"
          required: ["project_id", "provider"]
          properties:
            project_id: { type: "string" }
            provider: { type: "string", enum: ["github", "linear"] }
        output_schema:
          type: "object"
          properties:
            synced_count: { type: "integer" }
            conflicts: { type: "array", items: { type: "string" } }

      - name: "track_task"
        description: "Create or update project task"
        input_schema:
          type: "object"
          required: ["project_id", "title"]
          properties:
            project_id: { type: "string" }
            title: { type: "string" }
            description: { type: "string" }
            priority: { type: "integer", minimum: 1, maximum: 4 }
            status: { type: "string", enum: ["todo", "in_progress", "review", "done", "canceled"] }
            due_date: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            task_id: { type: "string" }
            created: { type: "boolean" }

  - id: "files"
    description: "Content-addressable file storage and hybrid search subsystem"
    methods:
      - name: "ingest_file"
        description: "Process and index a file into CAS storage"
        input_schema:
          type: "object"
          required: ["file_path"]
          properties:
            file_path: { type: "string" }
            extract_text: { type: "boolean", default: true }
            generate_embedding: { type: "boolean", default: true }
            tags: { type: "array", items: { type: "string" } }
        output_schema:
          type: "object"
          properties:
            file_id: { type: "string" }
            blake3_hash: { type: "string" }
            mime_type: { type: "string" }
            size_bytes: { type: "integer" }

      - name: "get_metadata"
        description: "Retrieve metadata and reference counts for content-addressed blob"
        input_schema:
          type: "object"
          required: ["blake3_hash"]
          properties:
            blake3_hash: { type: "string" }
        output_schema:
          type: "object"
          properties:
            blake3_hash: { type: "string" }
            size_bytes: { type: "integer" }
            ref_count: { type: "integer" }
            mime_type: { type: "string" }

      - name: "query_cas_blob"
        description: "Inspect extracted text content of a CAS blob"
        input_schema:
          type: "object"
          required: ["blake3_hash"]
          properties:
            blake3_hash: { type: "string" }
            max_bytes: { type: "integer", default: 1048576 }
        output_schema:
          type: "object"
          properties:
            content: { type: "string" }
            mime_type: { type: "string" }

      - name: "run_ocr"
        description: "Run OCR on stored image/PDF blob"
        input_schema:
          type: "object"
          required: ["blake3_hash"]
          properties:
            blake3_hash: { type: "string" }
            language: { type: "string", default: "eng" }
        output_schema:
          type: "object"
          properties:
            extracted_text: { type: "string" }
            confidence: { type: "number" }

  - id: "thoughts"
    description: "Zettelkasten knowledge graph and thought capture subsystem"
    methods:
      - name: "capture_note"
        description: "Quick capture a thought or note"
        input_schema:
          type: "object"
          required: ["content"]
          properties:
            title: { type: "string" }
            content: { type: "string" }
            thought_type: { type: "string", enum: ["fleeting", "journal", "atomic", "concept"], default: "fleeting" }
            tags: { type: "array", items: { type: "string" } }
        output_schema:
          type: "object"
          properties:
            thought_id: { type: "string" }
            wikilinks_extracted: { type: "array", items: { type: "string" } }

      - name: "query_graph"
        description: "Query the knowledge graph structure"
        input_schema:
          type: "object"
          required: ["thought_id"]
          properties:
            thought_id: { type: "string" }
            depth: { type: "integer", default: 2, maximum: 5 }
            direction: { type: "string", enum: ["outbound", "inbound", "both"], default: "both" }
        output_schema:
          type: "object"
          properties:
            nodes: { type: "array", items: { type: "object" } }
            edges: { type: "array", items: { type: "object" } }

      - name: "find_associative"
        description: "Find semantically related thoughts via vector similarity"
        input_schema:
          type: "object"
          required: ["query"]
          properties:
            query: { type: "string" }
            limit: { type: "integer", default: 5, maximum: 20 }
            min_similarity: { type: "number", default: 0.7, minimum: 0.0, maximum: 1.0 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              thought_id: { type: "string" }
              title: { type: "string" }
              similarity: { type: "number" }
              snippet: { type: "string" }

      - name: "evaluate_actionability"
        description: "Evaluate actionability and ambiguity scores for a thought"
        input_schema:
          type: "object"
          required: ["thought_id"]
          properties:
            thought_id: { type: "string" }
        output_schema:
          type: "object"
          properties:
            actionability_score: { type: "number" }
            ambiguity_score: { type: "number" }
            suggested_action: { type: "string" }

      - name: "synthesize_project"
        description: "Compile thought into an actionable project proposal and task DAG"
        input_schema:
          type: "object"
          required: ["thought_id"]
          properties:
            thought_id: { type: "string" }
            target_repo: { type: "string" }
        output_schema:
          type: "object"
          properties:
            project_proposal_id: { type: "string" }
            tasks_synthesized: { type: "integer" }

  - id: "activities"
    description: "Calendar, habit tracking, and life telemetry subsystem"
    methods:
      - name: "sync_calendar"
        description: "Synchronize with external calendar sources (iCal/CalDAV)"
        input_schema:
          type: "object"
          properties:
            source_url: { type: "string" }
            date_range_start: { type: "string", format: "date" }
            date_range_end: { type: "string", format: "date" }
        output_schema:
          type: "object"
          properties:
            events_imported: { type: "integer" }
            last_sync: { type: "string", format: "date-time" }

      - name: "schedule_block"
        description: "Allocate focus block checking for calendar conflicts"
        input_schema:
          type: "object"
          required: ["title", "start_time", "duration_min"]
          properties:
            title: { type: "string" }
            start_time: { type: "string", format: "date-time" }
            duration_min: { type: "integer" }
            category: { type: "string" }
        output_schema:
          type: "object"
          properties:
            activity_id: { type: "string" }
            conflicts_detected: { type: "array", items: { type: "string" } }

      - name: "log_habit"
        description: "Record a habit completion"
        input_schema:
          type: "object"
          required: ["habit_id"]
          properties:
            habit_id: { type: "string" }
            value: { type: "integer", default: 1 }
            timestamp: { type: "string", format: "date-time" }
        output_schema:
          type: "object"
          properties:
            log_id: { type: "string" }
            current_streak: { type: "integer" }
            longest_streak: { type: "integer" }

      - name: "get_daily_agenda"
        description: "Retrieve daily schedule and priorities"
        input_schema:
          type: "object"
          properties:
            date: { type: "string", format: "date" }
        output_schema:
          type: "object"
          properties:
            date: { type: "string" }
            activities: { type: "array", items: { type: "object" } }
            top_tasks: { type: "array", items: { type: "object" } }
            habit_reminders: { type: "array", items: { type: "object" } }

  - id: "workflows"
    description: "Declarative async workflow and durable saga subsystem"
    methods:
      - name: "dispatch_dag"
        description: "Execute a workflow DAG"
        input_schema:
          type: "object"
          required: ["workflow_id"]
          properties:
            workflow_id: { type: "string" }
            input_params: { type: "object" }
        output_schema:
          type: "object"
          properties:
            run_id: { type: "string" }
            status: { type: "string", enum: ["queued", "running", "success", "failed"] }

      - name: "dispatch_saga"
        description: "Dispatch a crash-resilient saga workflow with compensation steps"
        input_schema:
          type: "object"
          required: ["saga_name", "steps"]
          properties:
            saga_name: { type: "string" }
            steps: { type: "array", items: { type: "object" } }
        output_schema:
          type: "object"
          properties:
            saga_id: { type: "string" }
            status: { type: "string" }

      - name: "get_saga_status"
        description: "Query step execution, checkpoints, and rollback status for a saga"
        input_schema:
          type: "object"
          required: ["saga_id"]
          properties:
            saga_id: { type: "string" }
        output_schema:
          type: "object"
          properties:
            saga_id: { type: "string" }
            current_step: { type: "integer" }
            status: { type: "string" }

      - name: "trigger_routine"
        description: "Trigger a scheduled routine (morning_brief, evening_reflection, weekly_hygiene)"
        input_schema:
          type: "object"
          required: ["routine"]
          properties:
            routine: { type: "string", enum: ["morning_brief", "evening_reflection", "weekly_hygiene"] }
        output_schema:
          type: "object"
          properties:
            output_markdown: { type: "string" }
            artifacts: { type: "array", items: { type: "string" } }

  - id: "credentials"
    description: "Zero-knowledge encrypted vault and secret leasing subsystem"
    methods:
      - name: "acquire_lease"
        description: "Request ephemeral scoped access to a credential"
        input_schema:
          type: "object"
          required: ["secret_name", "agent_id"]
          properties:
            secret_name: { type: "string" }
            agent_id: { type: "string" }
            duration_seconds: { type: "integer", default: 300, maximum: 3600 }
            scope: { type: "string" }
        output_schema:
          type: "object"
          properties:
            lease_id: { type: "string" }
            expires_at: { type: "string", format: "date-time" }
            secret_value: { type: "string", description: "Memory-scrubbed on drop" }

      - name: "revoke_lease"
        description: "Revoke an active credential lease and scrub memory"
        input_schema:
          type: "object"
          required: ["lease_id"]
          properties:
            lease_id: { type: "string" }
        output_schema:
          type: "object"
          properties:
            revoked: { type: "boolean" }

      - name: "audit_trail"
        description: "Retrieve cryptographically signed vault access audit log"
        input_schema:
          type: "object"
          properties:
            secret_name: { type: "string" }
            limit: { type: "integer", default: 50, maximum: 200 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              entry_id: { type: "string" }
              operation: { type: "string" }
              timestamp: { type: "string", format: "date-time" }
              signature: { type: "string" }

  - id: "interactions"
    description: "Personal CRM, diarization, and communication tracking subsystem"
    methods:
      - name: "log_meeting"
        description: "Process meeting transcript, extract diarized debrief, decisions, and action items"
        input_schema:
          type: "object"
          required: ["title", "raw_transcript"]
          properties:
            title: { type: "string" }
            raw_transcript: { type: "string" }
            attendees: { type: "array", items: { type: "string" } }
        output_schema:
          type: "object"
          properties:
            interaction_id: { type: "string" }
            decisions: { type: "array", items: { type: "string" } }
            action_items: { type: "array", items: { type: "object" } }

      - name: "get_context"
        description: "Retrieve comprehensive contact timeline and context"
        input_schema:
          type: "object"
          required: ["contact_id_or_name"]
          properties:
            contact_id_or_name: { type: "string" }
        output_schema:
          type: "object"
          properties:
            contact_id: { type: "string" }
            name: { type: "string" }
            history: { type: "array", items: { type: "object" } }

      - name: "resolve_entity"
        description: "Deduplicate contact or vendor entity using TF-IDF / Jaro-Winkler"
        input_schema:
          type: "object"
          required: ["query_name"]
          properties:
            query_name: { type: "string" }
            email: { type: "string" }
        output_schema:
          type: "object"
          properties:
            canonical_id: { type: "string" }
            match_confidence: { type: "number" }

  - id: "purchases"
    description: "Financial ledger, subscription tracking, and HITL authorization subsystem"
    methods:
      - name: "log_expense"
        description: "Log an expense transaction to double-entry ledger"
        input_schema:
          type: "object"
          required: ["vendor", "amount_cents", "category"]
          properties:
            vendor: { type: "string" }
            amount_cents: { type: "integer" }
            currency: { type: "string", default: "USD" }
            category: { type: "string" }
        output_schema:
          type: "object"
          properties:
            purchase_id: { type: "string" }

      - name: "ingest_receipt"
        description: "Process invoice/receipt via OCR"
        input_schema:
          type: "object"
          required: ["file_path"]
          properties:
            file_path: { type: "string" }
        output_schema:
          type: "object"
          properties:
            purchase_id: { type: "string" }
            vendor: { type: "string" }
            amount_cents: { type: "integer" }

      - name: "audit_subscriptions"
        description: "Audit recurring subscriptions and price increases"
        input_schema:
          type: "object"
          properties:
            upcoming_days: { type: "integer", default: 30 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              subscription_id: { type: "string" }
              vendor: { type: "string" }
              amount_cents: { type: "integer" }
              price_hike_detected: { type: "boolean" }

      - name: "resolve_hitl"
        description: "Submit interactive human decision for queued financial operation"
        input_schema:
          type: "object"
          required: ["approval_id", "decision"]
          properties:
            approval_id: { type: "string" }
            decision: { type: "string", enum: ["approve", "reject"] }
        output_schema:
          type: "object"
          properties:
            processed: { type: "boolean" }
            ledger_block_hash: { type: "string" }

  - id: "storage_and_search"
    description: "Sub-15ms hybrid retrieval and vector embedding subsystem"
    methods:
      - name: "search_hybrid"
        description: "Execute fused Tantivy BM25 + sqlite-vec hybrid query"
        input_schema:
          type: "object"
          required: ["query"]
          properties:
            query: { type: "string" }
            filter_pillar: { type: "string" }
            limit: { type: "integer", default: 10 }
        output_schema:
          type: "array"
          items:
            type: "object"
            properties:
              item_id: { type: "string" }
              score: { type: "number" }
              snippet: { type: "string" }

  - id: "ledger_and_audit"
    description: "Cryptographic Merkle state attestation subsystem"
    methods:
      - name: "verify_chain"
        description: "Verify BLAKE3 / SHA-256 Merkle chain consistency"
        input_schema:
          type: "object"
        output_schema:
          type: "object"
          properties:
            verified: { type: "boolean" }
            block_count: { type: "integer" }
            latest_hash: { type: "string" }


mcp_consolidated_tools_v1_2:
  description: "12 Consolidated High-Leverage MCP Tools (Release 1.2.0 Pragmatic Lean Interface)"
  tools:
    - name: "pos_search"
      description: "Unified hybrid search across thoughts, files, tasks, and contacts (SQLite FTS5 + LanceDB)"
      parameters:
        type: "object"
        required: ["query"]
        properties:
          query: { type: "string" }
          mode: { type: "string", enum: ["hybrid", "lexical", "semantic"], default: "hybrid" }
          filter_pillar: { type: "string", enum: ["thoughts", "files", "projects", "activities", "interactions", "all"], default: "all" }
          limit: { type: "integer", default: 10 }
    - name: "pos_project"
      description: "Manage projects, Git worktrees, and task DAGs"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["status", "list", "create_worktree", "add_task", "execute_dag"] }
          project_id: { type: "string" }
          branch_name: { type: "string" }
          task_id: { type: "string" }
          task_title: { type: "string" }
    - name: "pos_file"
      description: "Ingest, read, and inspect files with automatic text extraction"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["ingest", "metadata", "read_text", "run_ocr"] }
          file_path: { type: "string" }
          blake3_hash: { type: "string" }
    - name: "pos_thought"
      description: "Capture, search, and synthesize Zettelkasten Markdown thoughts"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["capture", "read", "query_links", "synthesize_project"] }
          title: { type: "string" }
          content: { type: "string" }
          thought_id: { type: "string" }
          tags: { type: "array", items: { type: "string" } }
    - name: "pos_activity"
      description: "Inspect agenda, schedule focus blocks, and track habit streaks"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["agenda", "schedule_block", "habit_log", "habit_status"] }
          date: { type: "string" }
          title: { type: "string" }
          duration_min: { type: "integer" }
          habit_id: { type: "string" }
    - name: "pos_workflow"
      description: "Dispatch async workflows and trigger routine synthesizers"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["dispatch", "status", "cancel", "run_routine"] }
          workflow_id: { type: "string" }
          routine: { type: "string", enum: ["morning_brief", "evening_reflection", "weekly_hygiene"] }
    - name: "pos_vault"
      description: "Request ephemeral secret leases or audit access (HITL Gated)"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["request_lease", "revoke_lease", "audit_trail"] }
          secret_name: { type: "string" }
          duration_sec: { type: "integer", default: 300 }
          lease_id: { type: "string" }
    - name: "pos_interaction"
      description: "Log meeting debriefs, view contacts, and resolve entities"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["log_meeting", "get_contact", "resolve_entity"] }
          title: { type: "string" }
          raw_transcript: { type: "string" }
          contact_id_or_name: { type: "string" }
    - name: "pos_finance"
      description: "Log expenses, audit subscriptions, and resolve HITL approvals (HITL Gated)"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["log_expense", "list_subscriptions", "resolve_hitl"] }
          vendor: { type: "string" }
          amount: { type: "number" }
          category: { type: "string" }
          approval_id: { type: "string" }
          decision: { type: "string", enum: ["approve", "reject"] }
    - name: "pos_agent"
      description: "Spawn and monitor sandboxed subagents"
      parameters:
        type: "object"
        required: ["action"]
        properties:
          action: { type: "string", enum: ["spawn_task", "query_status", "kill"] }
          task_id: { type: "string" }
          instance_id: { type: "string" }
    - name: "pos_orchestrator"
      description: "Classify incoming intent and synthesize multi-domain routing plans"
      parameters:
        type: "object"
        required: ["action", "request_text"]
        properties:
          action: { type: "string", enum: ["classify", "route_plan"] }
          request_text: { type: "string" }
    - name: "pos_ledger"
      description: "Verify Merkle state ledger integrity"
      parameters:
