  max_memory_mb: 8192
  max_disk_mb: 10240
  max_concurrent_instances: 2

estimated_duration_seconds: 600
timeout_seconds: 1800

input_schema:
  type: object
  required:
    - source_databases
    - reconciliation_rules
  properties:
    source_databases:
      type: array
      items:
        type: object
        properties:
          database_id: { type: string }
          connection_string: { type: string }
          table_name: { type: string }
          primary_key: { type: string }

    reconciliation_rules:
      type: object
      properties:
        match_strategy: { type: string, enum: ["exact", "fuzzy", "semantic"] }
        conflict_resolution: { type: string, enum: ["source_priority", "newest", "manual"] }
        duplicate_threshold: { type: number }

output_schema:
  type: object
  required:
    - status
    - reconciliation_report_path
  properties:
    status:
      type: string
      enum: ["success", "partial", "failed"]

    reconciliation_report_path:
      type: string

    matched_records:
      type: integer

    unmatched_records:
      type: integer

    duplicates_detected:
      type: integer

    conflicts:
      type: array
      items:
        type: object
        properties:
          record_id: { type: string }
          conflict_type: { type: string }
          resolution_suggestion: { type: string }

