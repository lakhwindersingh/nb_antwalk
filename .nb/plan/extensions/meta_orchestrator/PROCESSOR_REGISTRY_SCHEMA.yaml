processor_name: Multi-Source Database Reconciliation Engine
version: 0.1.0
processor_type: domain_specific
status: planned

supported_intents:
  - reconciliation
  - data_analysis

complexity_levels:
  - moderate
  - complex

min_routing_confidence: 0.75
priority: 85

entry_point: .nb/plan/extensions/database_reconciliation/concise.md
entry_type: layerable_domain_plan

agent_requirements:
  - agent_db_connector
  - agent_reconciliation_engine
  - agent_duplicate_detector

workflow_requirements:
  - wf_db_connection
  - wf_data_extraction
  - wf_reconciliation
  - wf_conflict_resolution

