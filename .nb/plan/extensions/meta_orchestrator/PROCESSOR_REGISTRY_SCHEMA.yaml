# ============================================================================
# Example: financial_analysis processor (placeholder for future implementation)
# ============================================================================
processor_id: financial_analysis
processor_name: Financial Report Analysis & Variance Detection
version: 0.1.0
processor_type: domain_specific
status: planned

supported_intents:
  - data_analysis
  - synthesis

complexity_levels:
  - simple
  - moderate
  - complex

min_routing_confidence: 0.70
priority: 80

entry_point: .nb/plan/extensions/financial_analysis/concise.md
entry_type: layerable_domain_plan

agent_requirements:
  - agent_financial_analyzer
  - agent_variance_detector
  - agent_report_synthesizer

workflow_requirements:
  - wf_financial_ingestion
  - wf_variance_analysis
  - wf_report_generation

resource_requirements:
  ephemeral_worktrees: false
  git_operations: false
  llm_calls: high_frequency
  compute_tier: tier_b
  max_memory_mb: 4096
  max_disk_mb: 2048
  max_concurrent_instances: 5

estimated_duration_seconds: 120
timeout_seconds: 300

input_schema:
  type: object
  required:
    - report_source
    - analysis_type
  properties:
    report_source:
      type: string
      description: "Path to financial report (CSV, XLSX, PDF)"

    comparison_source:
      type: string
      description: "Optional comparison report path"

    analysis_type:
      type: string
      enum: ["variance", "trend", "summary", "forecast"]

    variance_threshold:
      type: number
      default: 0.10
      description: "Variance threshold for highlighting (e.g., 0.10 = 10%)"

    time_period:
      type: object
      properties:
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

output_schema:
  type: object
  required:
    - status
    - analysis_report_path
  properties:
    status:
      type: string
      enum: ["success", "partial", "failed"]

    analysis_report_path:
      type: string
      description: "Path to generated analysis report"

    variance_summary:
      type: object
      properties:
        total_variances_detected: { type: integer }
        significant_variances: { type: array }
        average_variance_percent: { type: number }

    visualizations:
      type: array
      items:
        type: object
        properties:
          chart_type: { type: string }
          path: { type: string }

    insights:
      type: array
      items:
        type: object
        properties:
          insight: { type: string }
          confidence: { type: number }
          supporting_data: { type: array }

classification_hints:
  strong_indicators:
    - "analyze financial"
    - "revenue report"
    - "variance analysis"
    - "compare Q[1-4]"
    - "profit and loss"

  weak_indicators:
    - "financial"
    - "report"
    - "analysis"

  exclusion_indicators:
    - "generate code"
    - "build system"
    - "reconcile database"

fallback_processor_id: generic_data_analysis

telemetry:
  emit_progress_updates: true
  progress_milestones:
    - report_ingestion_complete
    - data_validation_complete
    - variance_analysis_complete
    - insights_generated
    - visualizations_rendered

documentation_url: file://.nb/plan/extensions/financial_analysis/README.md
maintainer: pos_finance_team
tags:
  - financial_analysis
  - data_analysis
  - variance_detection

registration_date: "2026-10-04T00:00:00Z"
last_updated: "2026-10-04T00:00:00Z"

