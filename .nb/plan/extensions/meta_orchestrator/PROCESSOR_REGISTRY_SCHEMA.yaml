  emit_progress_updates: true
  progress_milestones:
    - db_connections_established
    - data_extraction_complete
    - matching_complete
    - duplicates_identified
    - conflicts_resolved

documentation_url: file://.nb/plan/extensions/database_reconciliation/README.md
