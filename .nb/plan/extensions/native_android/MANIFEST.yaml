---
manifest_version: "1.0.0"
plan_id: "extension_native_android"
name: "Native Android Apps with Google Assistant & Gemini Nano Integration"
type: "extension"
parent_plan: "personal_os"
status: "specification"
created: "2026-10-04"
updated: "2026-10-04"
version: "1.0.0"

metadata:
  description: "Native Android/WearOS apps with Google Assistant App Actions, Jetpack Glance, AppSearch, and on-device Gemini Nano"
  priority: "P0"
  impact: "high"
  effort: "high"
  platforms:
    - "Android 13+ (API 33+)"
    - "Wear OS 4+"
    - "Android Auto"

capabilities:
  range: "E-AND-01 to E-AND-12"
  list:
    - id: "E-AND-01"
      name: "Assistant App Actions"
      description: "Voice control via Google Assistant Built-in Intents (BIIs)"
    - id: "E-AND-02"
      name: "AppSearch Indexing"
      description: "Local on-device structured search exposed to system device search"
    - id: "E-AND-03"
      name: "Glance Widgets"
      description: "Interactive home screen and lock screen widgets built with Jetpack Compose"
    - id: "E-AND-04"
      name: "Rich Ongoing Notifications"
      description: "Real-time focus session countdown and status bar live chips"
    - id: "E-AND-05"
      name: "WorkManager Background Sync"
      description: "Battery-conscious, constrained background synchronization"
    - id: "E-AND-06"
      name: "Rust UniFFI JNI Bridge"
      description: "Direct safe Rust bindings cross-compiled for Android NDK"
    - id: "E-AND-07"
      name: "Hardware Keystore"
      description: "StrongBox / TEE hardware-backed key derivation & biometric gate"
    - id: "E-AND-08"
      name: "Wear OS Tiles & Complications"
      description: "Smartwatch standalone app with glanceable habit ticking and complications"
    - id: "E-AND-09"
      name: "On-Device Gemini Nano"
      description: "Local SLM text summarization via AICore without cloud network egress"
    - id: "E-AND-10"
      name: "TTS Audio Announcements"
      description: "Spoken morning briefs over Pixel Buds and Android Auto"
    - id: "E-AND-11"
      name: "Floating Bubbles & QS Tiles"
      description: "System-wide quick capture overlay and Quick Settings tile"
    - id: "E-AND-12"
      name: "Material You Dynamic Theming"
      description: "Fluid adaptation to system wallpaper palette and predictive back navigation"

dependencies:
  upstream:
    - "personal_os"
    - "pos_core"
    - "pos_server"
  wire_contracts:
    - ".nb/context/contracts/native_android_wire_contracts.yaml"
    - ".nb/context/contracts/personal_os_wire_contracts.yaml"

deliverables:
  - "workplace/modules/kiro_android/"
  - "workplace/modules/kiro_wearos/"
  - "workplace/modules/pos_android_bridge/"
