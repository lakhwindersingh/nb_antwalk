autonomous_execution:
  orchestrator_agent: agent_sequential_plan_orchestrator
  specialist_agent: agent_extension_thought_to_project_architect
  execution_engine: dynamic_dag
  worktree_isolation: true
  max_healing_loops: 3
  handoff_protocol: hmac_sha256_attested
  anti_drift_gate: true
  finops_metering: true
lifecycle_hooks:
  pre_spawn: percipience worktree lease --module extension_thought_to_project
  pre_execution: percipience check --ast-prune --schema-lint
  post_execution: pytest workplace/tests/ -v
  handover: percipience handoff issue --from agent_extension_thought_to_project_architect
    --to agent_qa_sentinel
  pre_merge_gate: percipience gate
  self_healing: percipience heal --max-attempts 3
  post_merge_seal: percipience merkle seal --worm-egress
specification_contracts:
  wire_contracts:
  - path: .nb/context/contracts/extension_thought_to_project_contract.yaml
    type: RPC_OR_EVENT_STREAM
    strict_mode: true
  - path: .nb/context/contracts/extension_thought_to_project_telemetry_schema.json
    type: STATE_TELEMETRY
    strict_mode: true
  invariant_rules:
  - path: .nb/context/rules/extension_thought_to_project_invariants.md
    type: ARCHITECTURAL_BOUNDARIES
  - path: .nb/context/rules/zero_drift_rules.md
    type: PERFORMANCE_AND_SECURITY
