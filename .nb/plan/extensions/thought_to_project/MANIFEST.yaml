key_capabilities:
- E-THOUGHT-01: Thought AST Parsing & Actionability Evaluation (CommonMark AST to
    semantic readiness score)
- E-THOUGHT-02: Autonomous MVS Input Derivation (Normalizes unstructured notes into
    formal specifications)
- E-THOUGHT-03: Ambiguity Entropy Analysis & HITL Clarification RFCs (Resolves vague
    requirements)
- E-THOUGHT-04: Domain Layer Plan Generator (Auto-generates custom domain layer plans
    per template)
- E-THOUGHT-05: Petgraph Task DAG Decomposition (Compiles plan into directed acyclic
    dependency graphs)
- E-THOUGHT-06: Ephemeral Git Worktree Provisioning (Isolates subagents in branch
    sandboxes via git2/worktree_engine)
- E-THOUGHT-07: Autonomous CI/CD Triad Execution Bridge (Closed-loop TDD self-healing
    and Merkle audit)
- E-THOUGHT-08: Bidirectional State Synchronization & Knowledge Closure (Backlinks
    commits/PRs to original thought)
