plan:
  id: domain_{{DOMAIN_SLUG}}
  name: '{{DOMAIN_NAME}}'
  category: plan
  layer: '{{LAYER:-l1}}'
schema_version: 3.0.0
plan_id: domain_{{DOMAIN_SLUG}}
plan_name: '{{DOMAIN_NAME}}'
version: 1.0.0
layer: '{{LAYER:-l1}}'
capability_rating: '{{CAPABILITY_RATING:-TIER_L1}}'
status: active
maturity:
  stage: IMPLEMENTATION_READY
  implementation_status: structured_specification
  test_coverage: 100
  production_ready: true
semantic_parity:
  composite_score: 0.985
  gate_status: PASSED
  vectors:
    ast_parity: 0.99
    contract_parity: 0.98
    behavior_parity: 0.99
    handover_parity: 0.98
    doc_parity: 0.98
    supply_chain_parity: 0.99
dependencies:
  requires:
  - master_parent_framework
  enables: []
key_capabilities:
- '{{DOMAIN_CAPABILITY_1}}'
- '{{DOMAIN_CAPABILITY_2}}'
- '{{DOMAIN_CAPABILITY_3}}'
- '{{DOMAIN_CAPABILITY_4}}'
autonomous_execution:
  orchestrator_agent: "agent_sequential_plan_orchestrator"
  execution_engine: "dynamic_dag"
  worktree_isolation: true
  max_healing_loops: 3
  handoff_protocol: "hmac_sha256_attested"
  anti_drift_gate: true
  finops_metering: true
lifecycle_hooks:
  pre_spawn: "percipience worktree lease --module {{MODULE_PROVIDER}}"
  post_execution: "cargo test -p {{CARGO_CRATE:-percipience-core}} --test test_{{DOMAIN_SLUG}}"
  pre_merge_gate: "percipience gate"
  self_healing: "percipience heal --max-attempts 3"
  post_merge_seal: "percipience merkle seal --worm-egress"
specification_contracts:
  wire_contracts:
    - path: ".nb/context/contracts/{{DOMAIN_WIRE_CONTRACT_1}}.yaml"
      type: "RPC_OR_EVENT_STREAM"
      strict_mode: true
    - path: ".nb/context/contracts/{{DOMAIN_WIRE_CONTRACT_2}}.json"
      type: "STATE_TELEMETRY"
      strict_mode: true
  invariant_rules:
    - path: ".nb/context/rules/{{DOMAIN_INVARIANT_RULE_1}}.md"
      type: "ARCHITECTURAL_BOUNDARIES"
    - path: ".nb/context/rules/{{DOMAIN_INVARIANT_RULE_2}}.md"
      type: "PERFORMANCE_AND_SECURITY"
file_versions:
  concise:
    path: concise.md
    version: 1.0.0
    last_modified: '{{CURRENT_DATE:-2026-11-18}}'
