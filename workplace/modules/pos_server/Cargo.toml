[package]
name = "pos_server"
version = "0.1.0"
edition = "2021"
authors = ["Personal OS Team"]
description = "Personal OS API Daemon and 12-Tool Model Context Protocol (MCP) Server"
license = "MIT OR Apache-2.0"

[dependencies]
pos_core = { path = "../pos_core" }
pos_orchestrator = { path = "../pos_orchestrator" }
pos_thoughts = { path = "../pos_thoughts" }
pos_email = { path = "../pos_email" }
pos_triage = { path = "../pos_triage" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.0"
