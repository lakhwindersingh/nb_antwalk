[package]
name = "pos_thoughts"
version = "0.1.0"
edition = "2021"
authors = ["nb_antwalk contributors"]
license = "MIT OR Apache-2.0"
description = "Thought capture, evaluation, and readiness scoring for thought-to-project pipeline"
repository = "https://github.com/antwalk/nb_antwalk"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Future dependencies (commented until Phase 1 core implementation):
# pulldown-cmark = "0.9"  # Markdown AST parsing
# sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }  # Storage

[dev-dependencies]
tokio-test = "0.4"

[lib]
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"
