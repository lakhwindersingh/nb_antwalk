[package]
name = "pos_thoughts"
version = "0.1.0"
edition = "2021"
authors = ["nb_antwalk contributors"]
license = "MIT OR Apache-2.0"
description = "Thought capture, evaluation, and readiness scoring for thought-to-project pipeline"
repository = "https://github.com/antwalk/nb_antwalk"

[dependencies]
# Core POS dependencies
pos_core = { path = "../pos_core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Graph
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

[lib]
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"
